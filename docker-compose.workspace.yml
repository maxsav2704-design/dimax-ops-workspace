x-backend-runtime: &backend-runtime
  image: dimax-backend-workspace:local
  env_file:
    - ./backend/.env
  environment:
    XDG_CACHE_HOME: /tmp/.cache
    DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dimax
    JWT_SECRET: ${DIMAX_WORKSPACE_JWT_SECRET:-dimax-workspace-local-only-jwt-secret-2026-rotate-for-production}
    PUBLIC_BASE_URL: http://localhost:8000
    PUBLIC_APP_BASE_URL: http://localhost:5174
    CORS_ALLOW_ORIGINS: ${DIMAX_PREVIEW_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: dimax
    MINIO_SECURE: "false"
    EMAIL_ENABLED: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: "false"
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: journal@dimax.local
    AUTH_LOGIN_RL_WINDOW_SEC: ${DIMAX_AUTH_LOGIN_RL_WINDOW_SEC:-60}
    AUTH_LOGIN_RL_MAX_REQ: ${DIMAX_AUTH_LOGIN_RL_MAX_REQ:-30}
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dimax
    ports:
      - "5434:5432"
    volumes:
      - workspace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dimax"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - workspace_minio_data:/data

  minio_init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      set -eu;
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/dimax || true;
      mc anonymous set none local/dimax;
      echo 'MinIO bucket ready';
      "

  mailpit:
    image: axllent/mailpit:v1.30.3
    restart: unless-stopped
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:8025:8025"

  api:
    <<: *backend-runtime
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15m

  sync-health:
    <<: *backend-runtime
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.scripts.run_sync_health_job
    restart: unless-stopped

  outbox-worker:
    <<: *backend-runtime
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    command: python -m app.workers.outbox_worker
    restart: unless-stopped

  maintenance-worker:
    <<: *backend-runtime
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.workers.maintenance_worker
    restart: unless-stopped

  sync-gc-worker:
    <<: *backend-runtime
    depends_on:
      api:
        condition: service_healthy
    command: python -m app.workers.sync_gc_worker
    restart: unless-stopped

  admin:
    image: node:20-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      DIMAX_PRESERVE_NEXT_ROOT: "1"
      NODE_OPTIONS: --max-old-space-size=1024
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
      NPM_CONFIG_FETCH_TIMEOUT: "120000"
      NPM_CONFIG_FUND: "false"
      VITE_API_BASE_URL: http://localhost:8000
    cpus: 2.0
    ports:
      - "5173:5173"
    volumes:
      - ./dimax-operations-suite-main:/app
      - workspace_admin_node_modules:/app/node_modules
      - workspace_admin_next:/app/.next
      - workspace_admin_npm_cache:/root/.npm
    command: >
      sh -c "if [ ! -d node_modules/next ] || [ ! -f node_modules/.package-lock.json ] ||
             [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci --prefer-offline; fi &&
             ./node_modules/.bin/next dev --turbopack -H 0.0.0.0 -p 5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  workspace_admin_next:
  workspace_admin_node_modules:
  workspace_admin_npm_cache:
  workspace_pgdata:
  workspace_minio_data:
