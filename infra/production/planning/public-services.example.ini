; Planning data only. No application or deployment script loads this file.
; Do not rename to .env.local or use with docker compose --env-file.
; Replace reserved domains only after real infrastructure is provisioned.
[edge]
DIMAX_API_HOST = api.dimax.example
DIMAX_ADMIN_HOST = ops.dimax.example
DIMAX_TLS_EMAIL = infrastructure@dimax.example

[backend]
PUBLIC_BASE_URL = https://api.dimax.example
PUBLIC_APP_BASE_URL = https://ops.dimax.example
CORS_ALLOW_ORIGINS = https://ops.dimax.example
EMAIL_ENABLED = true
SMTP_HOST = smtp.dimax.example
SMTP_PORT = 587
SMTP_TLS = true
SMTP_FROM = notifications@dimax.example

[admin_build]
NEXT_PUBLIC_API_BASE_URL = https://api.dimax.example

[mobile_build]
EXPO_PUBLIC_API_BASE_URL = https://api.dimax.example
