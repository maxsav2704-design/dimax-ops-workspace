name: dimax_acceptance

x-api: &api
  image: dimax-backend-workspace:local
  init: true
  mem_limit: 384m
  memswap_limit: 384m
  cpus: 1.0
  pids_limit: 128
  environment: &environment
    APP_ENV: test
    DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/dimax_acceptance
    JWT_SECRET: acceptance-only-not-a-production-secret-20260909
    PUBLIC_BASE_URL: http://localhost:8001
    PUBLIC_APP_BASE_URL: http://localhost:4190
    CORS_ALLOW_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,http://localhost:4189,http://127.0.0.1:4189,http://localhost:4190,http://127.0.0.1:4190
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: acceptance
    MINIO_SECURE: "false"
    EMAIL_ENABLED: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: "false"
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: acceptance@example.test
    WHATSAPP_ENABLED: "false"
    WHATSAPP_FALLBACK_TO_EMAIL: "false"
    TWILIO_ACCOUNT_SID: ""
    TWILIO_AUTH_TOKEN: ""
    PLATFORM_API_TOKEN: ""
    SYNC_ALERT_WEBHOOK_URL: ""
    PLAN_ALERT_WEBHOOK_URL: ""
  volumes:
    - ./backend:/app
    - ./acceptance/empty.env:/app/.env:ro
  depends_on:
    db:
      condition: service_healthy
    minio:
      condition: service_started
    mailpit:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    command: postgres -c shared_buffers=32MB -c max_connections=30
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dimax_acceptance
    volumes:
      - acceptance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dimax_acceptance"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: dimax-minio:source-9e49d5e
    pull_policy: build
    build:
      context: ./infra/minio
      target: server
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - acceptance_files:/data
  mailpit:
    image: axllent/mailpit:v1.30.3
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_MAX_MESSAGES: "200"
  api:
    <<: *api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "--output", "/dev/null", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 8s
      start_period: 180s
      retries: 12
  gateway:
    image: caddy:2.11.4-alpine
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    # The image's Caddy binary carries this file capability, including on high ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./acceptance/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:8026:8025"
    networks: [default, ingress]
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
  outbox-worker:
    <<: *api
    profiles: [delivery]
    command: python -m app.workers.outbox_worker

networks:
  default:
    internal: true
  ingress:

volumes:
  acceptance_pgdata:
  acceptance_files:
